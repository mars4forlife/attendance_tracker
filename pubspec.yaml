name: attendance_tracker
description: "Цифровая платформа учета посещаемости студентов"
publish_to: 'none'

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0

  provider: ^6.1.2
  intl: ^0.19.0
  fluttertoast: ^8.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true